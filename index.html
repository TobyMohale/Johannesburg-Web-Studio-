<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johannesburg Web Studio | Premium Web Design & Hosting</title>
    <meta name="description" content="Professional, mobile-first web design and lightning-fast hosting in South Africa. Get your high-converting business website today." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Johannesburg Web Studio | Premium Web Design & Hosting" />
    <meta property="og:description" content="Professional, mobile-first web design and lightning-fast hosting in South Africa. Get your high-converting business website today." />
    <meta id="og-image" property="og:image" content="/jws_homepage_preview.jpg" />
    <meta id="og-image-secure" property="og:image:secure_url" content="/jws_homepage_preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Johannesburg Web Studio | Premium Web Design & Hosting" />
    <meta name="twitter:description" content="Professional, mobile-first web design and lightning-fast hosting in South Africa. Get your high-converting business website today." />
    <meta id="twitter-image" name="twitter:image" content="/jws_homepage_preview.jpg" />

    <!-- Dynamic Social Share Resolver -->
    <script>
      try {
        var origin = window.location.origin;
        if (origin) {
          var imagePath = origin + '/jws_homepage_preview.jpg';
          document.getElementById('og-image').setAttribute('content', imagePath);
          document.getElementById('og-image-secure').setAttribute('content', imagePath);
          document.getElementById('twitter-image').setAttribute('content', imagePath);
        }
      } catch (e) {
        console.warn('Social share paths fallback active', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
